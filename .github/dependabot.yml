version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      anthropic:
        patterns:
          - "@anthropic-ai/*"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "@anthropic-ai/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
