version: '1'

prompt: |
  Ask me what programming language I prefer, then write a hello
  world program in that language and save it to hello.txt

# Allow tool use
tools:
  - Read
  - Write
  - AskUserQuestion

# Simulate a user
user:
  persona: |
    You are a Python enthusiast. When asked about programming languages,
    always choose Python. You prefer simple, readable code.
