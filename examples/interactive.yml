# Session with AskUserQuestion handling via synthetic user
version: "1"

prompt: |
  Ask the user what programming language they prefer, then write
  a hello world program in that language and save it to hello.txt

tools:
  - Read
  - Write
  - AskUserQuestion

user:
  persona: |
    You are a Python enthusiast. When asked about programming languages,
    always choose Python. You prefer simple, readable code.
